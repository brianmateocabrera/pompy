<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo Visual</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 20px;
            background: #f4f6f8;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #eaeaea;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-size: 18px;
            margin: 0 0 10px;
            color: #222;
        }

        .card-price {
            font-size: 20px;
            font-weight: bold;
            color: #0070f3;
            margin: 0 0 10px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <h1>Catálogo de Productos</h1>

    <div id="catalogo" class="grid">
        Cargando productos...
    </div>


<script>

function escaparHTML(texto) {
    return String(texto || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}


async function cargar() {

    try {

        const res = await fetch('/api/crud', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'GET',
                path: 'data/productos.json'
            })
        });


        const json = await res.json();


        const contenedor =
            document.getElementById('catalogo');


        if (
            !json.success ||
            !json.data ||
            !json.data.length
        ) {

            contenedor.innerHTML =
                '<p style="grid-column:1/-1;text-align:center;">No hay productos disponibles.</p>';

            return;

        }


        contenedor.innerHTML =
            json.data.map(p => {

                const nombre =
                    escaparHTML(p.nombre);

                const descripcion =
                    escaparHTML(
                        p.descripcion ||
                        'Sin descripción disponible.'
                    );

                const imagen =
                    escaparHTML(
                        p.imagen ||
                        '/imagenes/no-image.webp'
                    );


                const precio =
                    new Intl.NumberFormat(
                        'es-AR',
                        {
                            style: 'currency',
                            currency: 'ARS'
                        }
                    ).format(p.precio);



                return `

                    <div class="card">

                        <img 
    src="${p.imagen || fallbackImg}" 
    class="card-img" 
    alt="${p.nombre}"
    onerror="this.src='/imagenes/no-image.webp'"
>

                        <div class="card-info">

                            <h3 class="card-title">
                                ${nombre}
                            </h3>

                            <p class="card-price">
                                ${precio}
                            </p>

                            <p class="card-desc">
                                ${descripcion}
                            </p>

                        </div>

                    </div>

                `;

            }).join('');


    } catch (error) {

        document.getElementById('catalogo').innerHTML =
            '<p>Error al cargar el catálogo.</p>';

    }

}


cargar();

</script>

</body>
</html>
