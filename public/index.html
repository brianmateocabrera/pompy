<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>POMPY Lencería y sex-shop</title>

    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <header>
        <h1>Catálogo de Productos</h1>
        <p>Encontrá el producto que estás buscando</p>
    </header>


    <main>
        <section
    id="banners"
    class="banners"
></section>

        <section class="filtros">

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar producto..."
                autocomplete="off"
            >

            <select id="categoria">
                <option value="">Todas las categorías</option>
            </select>

            <select id="disponibilidad">
                <option value="">Toda disponibilidad</option>
                <option value="disponible">
                    Disponible
                </option>
                <option value="agotado">
                    Sin stock
                </option>
            </select>

            <select id="ordenamiento">
                <option value="orden">
                    Orden predeterminado
                </option>
                <option value="precio-menor">
                    Precio: menor a mayor
                </option>
                <option value="precio-mayor">
                    Precio: mayor a menor
                </option>
                <option value="nombre">
                    Nombre: A-Z
                </option>
            </select>

        </section>


        <p
            id="resultadoInfo"
            class="resultado-info"
        ></p>


        <section
            id="catalogo"
            class="grid"
        >
            <p class="sin-resultados">
                Cargando productos...
            </p>
        </section>

    </main>

<script src="/js/index.js"></script>
</body>
</html>
