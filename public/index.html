<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMPY Lencería y Sex-Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Tilt+Neon&display=swap" rel="stylesheet">

    <style>
    body {
        /* Segoe UI: Alta legibilidad para el cuerpo de texto y descripciones generales */
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 20px;
        background: #000000;
        color: #ffffff;
    }

    h1 {
        /* Tilt Neon: Ideal para el estilo neón del encabezado principal */
        font-family: 'Tilt Neon', sans-serif;
        text-align: center;
        margin-bottom: 30px;
        color: #ff1744;
        text-shadow:
            0 0 5px #ff1744,
            0 0 10px #ff1744,
            0 0 20px #ff0055,
            0 0 40px #ff0055;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .card {
        background: #0a0a0a;
        border: 1px solid #ff1744;
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
            0 0 5px rgba(255, 23, 68, 0.7),
            0 0 15px rgba(255, 0, 85, 0.25);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow:
            0 0 8px #ff1744,
            0 0 20px #ff0055,
            0 0 35px rgba(255, 0, 85, 0.5);
    }

    .card-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: #111111;
    }

    .card-info {
        padding: 15px;
    }

    .card-title {
        /* Tilt Neon: Mantiene el tono visual moderno y encaja bien con la sombra de texto */
        font-family: 'Tilt Neon', sans-serif;
        font-size: 18px;
        margin: 0 0 10px;
        color: #ffffff;
        text-shadow:
            0 0 4px #ff1744,
            0 0 8px rgba(255, 23, 68, 0.8);
    }

    .card-price {
        /* Segoe UI: Mantiene números claros, legibles y destacados comercialmente */
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        color: #ff4081;
        margin: 0 0 10px;
        text-shadow:
            0 0 5px #ff4081,
            0 0 10px rgba(255, 64, 129, 0.7);
    }

    .card-desc {
        /* Segoe UI: Máxima legibilidad para lectura de texto extenso en la tarjeta */
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        color: #d8d8d8;
        margin: 0;
        line-height: 1.4;
    }

    /* Meow Script: Uso comercial recomendado solo en elementos secundarios de acento (etiquetas/badging) */
    .card-badge {
        font-family: 'Meow Script', cursive;
        font-size: 18px;
        color: #ff4081;
    }

    @media (max-width: 600px) {
        body {
            margin: 10px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 16px;
        }

        .card-price {
            font-size: 18px;
        }

        .card-desc {
            font-size: 13px;
        }

        .card-img {
            height: 160px;
        }
    }
</style>

</head>

<body>

    <h1>Lencería y Sex-Shop</h1>

    <div id="catalogo" class="grid">
        Cargando productos...
    </div>


<script>

function escaparHTML(texto) {
    return String(texto || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}


async function cargar() {

    try {

        const res = await fetch('/api/crud', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'GET',
                path: 'data/productos.json'
            })
        });


        const json = await res.json();


        const contenedor =
            document.getElementById('catalogo');


        if (
            !json.success ||
            !json.data ||
            !json.data.length
        ) {

            contenedor.innerHTML =
                '<p style="grid-column:1/-1;text-align:center;">No hay productos disponibles.</p>';

            return;

        }


        contenedor.innerHTML =
            json.data.map(p => {

                const nombre =
                    escaparHTML(p.nombre);

                const descripcion =
                    escaparHTML(
                        p.descripcion ||
                        'Sin descripción disponible.'
                    );

                const imagen =
                    escaparHTML(
                        p.imagen ||
                        '/imagenes/no-image.webp'
                    );


                const precio =
                    new Intl.NumberFormat(
                        'es-AR',
                        {
                            style: 'currency',
                            currency: 'ARS'
                        }
                    ).format(p.precio);



                return `

                    <div class="card">

                        <img 
    src="${p.imagen || fallbackImg}" 
    class="card-img" 
    alt="${p.nombre}"
    onerror="this.src='/imagenes/no-image.webp'"
>

                        <div class="card-info">

                            <h3 class="card-title">
                                ${nombre}
                            </h3>

                            <p class="card-price">
                                ${precio}
                            </p>

                            <p class="card-desc">
                                ${descripcion}
                            </p>

                        </div>

                    </div>

                `;

            }).join('');


    } catch (error) {

        document.getElementById('catalogo').innerHTML =
            '<p>Error al cargar el catálogo.</p>';

    }

}


cargar();

</script>

</body>
</html>
