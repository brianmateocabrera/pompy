<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Modular</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <h1>Panel de Administración</h1>
    
    <form id="prodForm">
        <h2 id="formTitle">Agregar Nuevo Producto</h2>
        <input type="hidden" id="editIndex" value="-1">
        
        <input type="text" id="nombre" placeholder="Nombre del producto" required>
        <input type="number" id="precio" placeholder="Precio ($)" required step="0.01">
        
        <label>Imagen del producto (Se optimizará a WebP de forma automática):</label>
        <input type="file" id="imagenFile" accept="image/*">
        
        <input type="text" id="descripcion" placeholder="Descripción breve">
        
        <button type="submit" id="btnGuardar">Guardar Producto</button>
        <button type="button" id="btnCancelar" class="btn-cancelar" style="display: none;">Cancelar</button>
    </form>

    <h2>Inventario de Productos</h2>
    <p id="loadingText" class="loading" style="display: none;"></p>
    
    <table>
        <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaProductos">
            <tr><td colspan="5">Cargando inventario...</td></tr>
        </tbody>
    </table>

    <!-- Inicializador del módulo -->
    <script type="module" src="/js/admin.js"></script>
</body>
</html>
