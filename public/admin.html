<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel Administrador</title>

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >
</head>

<body>

    <main>

        <!-- ==============================
             VISTA BANNERS
        =============================== -->

        <section
            id="vistaBanners"
            class="vista-admin activa"
        >

            <h1>Banners</h1>

            <form id="bannerForm">

                <h2 id="bannerFormTitle">
                    Agregar banner
                </h2>

                <label for="bannerTitulo">
                    Título
                </label>

                <input
                    type="text"
                    id="bannerTitulo"
                    placeholder="Título del banner"
                >

                <label for="bannerEnlace">
                    Enlace
                </label>

                <input
                    type="text"
                    id="bannerEnlace"
                    placeholder="/productos o https://..."
                >

                <label for="bannerOrden">
                    Orden
                </label>

                <input
                    type="number"
                    id="bannerOrden"
                    value="0"
                    min="0"
                    step="1"
                >

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="bannerActivo"
                        checked
                    >

                    Banner activo

                </label>

                <label for="bannerImagen">
                    Imagen del banner
                </label>

                <input
                    type="file"
                    id="bannerImagen"
                    accept="image/*"
                    required
                >

                <div
                    id="bannerImagenActual"
                    class="banner-imagen-actual"
                ></div>

                <button
                    type="submit"
                    id="btnBannerGuardar"
                >
                    Agregar banner
                </button>

                <button
                    type="button"
                    id="btnBannerCancelar"
                    class="btn-cancelar"
                    style="display:none;"
                >
                    Cancelar
                </button>

            </form>


            <h2>Banners cargados</h2>

            <div
                id="listaBanners"
                class="lista-banners"
            >
                <p>Cargando banners...</p>
            </div>

        </section>


        <!-- ==============================
             VISTA PRODUCTOS
        =============================== -->

        <section
            id="vistaProductos"
            class="vista-admin"
        >

            <h1>Productos</h1>

            <form id="prodForm">

                <h2 id="formTitle">
                    Agregar Nuevo Producto
                </h2>

                <input
                    type="hidden"
                    id="editIndex"
                    value="-1"
                >

                <h3>Identificación</h3>

                <input
                    type="text"
                    id="sku"
                    placeholder="SKU"
                >

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del producto"
                    required
                >

                <h3>Precios</h3>

                <input
                    type="number"
                    id="precioCosto"
                    placeholder="Precio de costo ($)"
                    min="0"
                    step="0.01"
                >

                <input
                    type="number"
                    id="precio"
                    placeholder="Precio de venta ($)"
                    required
                    min="0"
                    step="0.01"
                >

                <input
                    type="number"
                    id="precioAnterior"
                    placeholder="Precio anterior ($)"
                    min="0"
                    step="0.01"
                >

                <h3>Información del producto</h3>

                <textarea
                    id="descripcion"
                    placeholder="Descripción del producto"
                ></textarea>


                <div class="campo-lista">

                    <label for="categoria">
                        Categorías
                    </label>

                    <div class="lista-input">

                        <input
                            type="text"
                            id="categoria"
                            placeholder="Escribí una categoría"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="btn-agregar-lista"
                            data-lista="categoria"
                        >
                            Agregar
                        </button>

                    </div>

                    <div
                        id="categoriaLista"
                        class="chips"
                    ></div>

                </div>


                <div class="campo-lista">

                    <label for="tags">
                        Tags
                    </label>

                    <div class="lista-input">

                        <input
                            type="text"
                            id="tags"
                            placeholder="Escribí un tag"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="btn-agregar-lista"
                            data-lista="tags"
                        >
                            Agregar
                        </button>

                    </div>

                    <div
                        id="tagsLista"
                        class="chips"
                    ></div>

                </div>


                <div class="campo-lista">

                    <label for="badges">
                        Badges
                    </label>

                    <div class="lista-input">

                        <input
                            type="text"
                            id="badges"
                            placeholder="Ej.: 20%, Nuevo, Oferta"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="btn-agregar-lista"
                            data-lista="badges"
                        >
                            Agregar
                        </button>

                    </div>

                    <div
                        id="badgesLista"
                        class="chips"
                    ></div>

                </div>


                <h3>Stock y variantes</h3>

                <input
                    type="number"
                    id="stock"
                    placeholder="Stock"
                    min="0"
                    step="1"
                >


                <div class="campo-lista">

                    <label for="talles">
                        Talles
                    </label>

                    <div class="lista-input">

                        <input
                            type="text"
                            id="talles"
                            placeholder="Escribí un talle"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="btn-agregar-lista"
                            data-lista="talles"
                        >
                            Agregar
                        </button>

                    </div>

                    <div
                        id="tallesLista"
                        class="chips"
                    ></div>

                </div>


                <div class="campo-lista">

                    <label for="colores">
                        Colores
                    </label>

                    <div class="lista-input">

                        <input
                            type="text"
                            id="colores"
                            placeholder="Escribí un color"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="btn-agregar-lista"
                            data-lista="colores"
                        >
                            Agregar
                        </button>

                    </div>

                    <div
                        id="coloresLista"
                        class="chips"
                    ></div>

                </div>


                <h3>Imágenes</h3>

                <label>
                    Agregar imágenes del producto
                </label>

                <input
                    type="file"
                    id="imagenFile"
                    accept="image/*"
                    multiple
                >

                <div
                    id="imagenesPreview"
                    class="imagenes-preview"
                ></div>


                <h3>Configuración</h3>

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="activo"
                        checked
                    >

                    Producto activo

                </label>


                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="destacado"
                    >

                    Producto destacado

                </label>


                <input
                    type="number"
                    id="orden"
                    placeholder="Orden de aparición"
                    min="0"
                    step="1"
                    value="0"
                >


                <button
                    type="submit"
                    id="btnGuardar"
                >
                    Guardar Producto
                </button>


                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-cancelar"
                    style="display:none;"
                >
                    Cancelar
                </button>

            </form>


            <h2>Inventario de Productos</h2>

            <p
                id="loadingText"
                class="loading"
                style="display:none;"
            ></p>

            <table>

                <thead>

                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>SKU</th>
                        <th>Costo</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaProductos">

                    <tr>
                        <td colspan="8">
                            Cargando inventario...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <!-- ==============================
         NAVEGACIÓN INFERIOR
    =============================== -->

    <nav class="admin-nav">

        <button
            type="button"
            class="admin-nav-item activo"
            data-vista="vistaBanners"
        >
            <span class="admin-nav-icon">▣</span>
            <span>Banners</span>
        </button>

        <button
            type="button"
            class="admin-nav-item"
            data-vista="vistaProductos"
        >
            <span class="admin-nav-icon">▤</span>
            <span>Productos</span>
        </button>

    </nav>


    <script
        type="module"
        src="/js/admin.js"
    ></script>

    <script
        type="module"
        src="/js/admin-banners.js"
    ></script>

    <script
        type="module"
        src="/js/admin-navegacion.js"
    ></script>

</body>
</html>
