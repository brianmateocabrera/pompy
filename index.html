<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Lencería - POMPY SEX-SHOP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="sticky-header py-2 px-3 mb-4">
    <div class="container-fluid d-flex align-items-center justify-content-between gap-2">
      <button class="btn text-white p-1 border-0 shadow-none d-flex align-items-center" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilterMenu" aria-controls="offcanvasFilterMenu" aria-label="Abrir menú de filtros">
        <i class="bi bi-sliders fs-3"></i>
      </button>

      <a href="#" class="mx-auto text-decoration-none d-flex align-items-center justify-content-center">
        <img src="imagenes/logo.jpeg" alt="Logo Lencería" class="header-logo" onerror="this.onerror=null; this.src='https://placehold.co/200x50/111217/ffffff?text=POMPY';">
      </a>

      <button class="btn text-white p-1 border-0 shadow-none position-relative" type="button" data-bs-toggle="modal" data-bs-target="#wishlistModal" aria-label="Ver lista de favoritos">
        <i class="bi bi-heart fs-4"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="wishlistBadge" style="font-size: 0.65rem;">
          0
        </span>
      </button>
    </div>
  </header>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasFilterMenu" aria-labelledby="offcanvasFilterMenuLabel">
    <div class="offcanvas-header offcanvas-dark-header">
      <h5 class="offcanvas-title fw-bold" id="offcanvasFilterMenuLabel">
        <i class="bi bi-sliders me-2"></i>Filtros y Orden
      </h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <div class="offcanvas-body p-3">
      <div class="accordion" id="mainFilterAccordion">
        <div class="accordion-item border-0 mb-3 shadow-sm rounded overflow-hidden">
          <h2 class="accordion-header" id="headingFilterBy">
            <button class="accordion-button fw-bold text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFilterBy" aria-expanded="true" aria-controls="collapseFilterBy">
              <i class="bi bi-funnel me-2"></i>Filtrar por
            </button>
          </h2>
          <div id="collapseFilterBy" class="accordion-collapse collapse show" aria-labelledby="headingFilterBy" data-bs-parent="#mainFilterAccordion">
            <div class="accordion-body p-2">
              <div class="accordion nested-accordion" id="subFilterAccordion">

                <div class="accordion-item mb-2 border rounded">
                  <h3 class="accordion-header" id="headingSubCategory">
                    <button class="accordion-button collapsed fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSubCategory" aria-expanded="false" aria-controls="collapseSubCategory">
                      SUB-CATEGORÍA
                    </button>
                  </h3>
                  <div id="collapseSubCategory" class="accordion-collapse collapse" aria-labelledby="headingSubCategory" data-bs-parent="#subFilterAccordion">
                    <div class="accordion-body small py-2 px-3" id="filterCategoryContainer">
                    </div>
                  </div>
                </div>

                <div class="accordion-item mb-2 border rounded">
                  <h3 class="accordion-header" id="headingSubBrand">
                    <button class="accordion-button collapsed fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSubBrand" aria-expanded="false" aria-controls="collapseSubBrand">
                      MARCA
                    </button>
                  </h3>
                  <div id="collapseSubBrand" class="accordion-collapse collapse" aria-labelledby="headingSubBrand" data-bs-parent="#subFilterAccordion">
                    <div class="accordion-body small py-2 px-3" id="filterBrandContainer">
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

        <div class="accordion-item border-0 shadow-sm rounded overflow-hidden">
          <h2 class="accordion-header" id="headingSortBy">
            <button class="accordion-button collapsed fw-bold text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSortBy" aria-expanded="false" aria-controls="collapseSortBy">
              <i class="bi bi-sort-down me-2"></i>Ordenar por
            </button>
          </h2>
          <div id="collapseSortBy" class="accordion-collapse collapse" aria-labelledby="headingSortBy" data-bs-parent="#mainFilterAccordion">
            <div class="accordion-body p-3">
              <div class="form-check my-2">
                <input class="form-check-input sort-radio" type="radio" name="sortOptions" id="sortPriceLow" value="priceLow" checked>
                <label class="form-check-label small" for="sortPriceLow">Menor precio primero</label>
              </div>
              <div class="form-check my-2">
                <input class="form-check-input sort-radio" type="radio" name="sortOptions" id="sortPriceHigh" value="priceHigh">
                <label class="form-check-label small" for="sortPriceHigh">Mayor precio primero</label>
              </div>
              <div class="form-check my-2">
                <input class="form-check-input sort-radio" type="radio" name="sortOptions" id="sortNameAZ" value="nameAZ">
                <label class="form-check-label small" for="sortNameAZ">Nombre A-Z</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="button" class="btn btn-dark-custom" id="btnApplyFilters" data-bs-dismiss="offcanvas">Aplicar Filtros</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnResetFilters">Limpiar Filtros</button>
      </div>
    </div>
  </div>

  <main class="container py-2 py-md-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
      <div>
        <h1 class="h3 fw-bold text-dark mb-1">Catálogo de POMPY SEX-SHOP</h1>
        <p class="text-muted small mb-0">Consultá tus productos favoritos directamente a nuestro WhatsApp.</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="input-group input-group-sm search-box">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
          <input type="search" class="form-control border-start-0 ps-0" id="searchInput" placeholder="Buscar producto...">
        </div>
        <span class="badge bg-white text-dark border px-3 py-2 rounded-pill shadow-sm text-nowrap" id="productCountBadge">
          Cargando...
        </span>
      </div>
    </div>

    <div class="row row-cols-2 row-cols-sm-2 row-cols-lg-4 g-3 g-md-4" id="productsGrid">
      <div class="col"><div class="skeleton-card"></div></div>
      <div class="col"><div class="skeleton-card"></div></div>
      <div class="col"><div class="skeleton-card"></div></div>
      <div class="col"><div class="skeleton-card"></div></div>
    </div>

    <div class="text-center mt-4 d-none" id="loadMoreContainer">
      <button class="btn btn-outline-dark px-4 py-2" id="btnLoadMore">Cargar más productos</button>
    </div>
  </main>

  <div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-4 pt-0" id="productDetailContent">
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="wishlistModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header offcanvas-dark-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-heart me-2"></i>Mis Favoritos</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-3" id="wishlistModalBody">
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-whatsapp-custom w-100" id="btnSendWishlistWs" disabled>
            <i class="bi bi-whatsapp me-2"></i>Consultar Lista por WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="mt-5 py-4 text-center text-white-50" style="background-color: #111217;">
    <div class="container">
      <p class="small mb-0">&copy; 2026 Catálogo de Lencería. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
