<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POMPY | E-Commerce Catalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="announcement-bar">
    <span>ENVÍOS A TODO EL PAÍS — CONSULTÁ TUS PRENDAS FAVORITAS POR WHATSAPP</span>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <button class="menu-btn" id="openMenuBtn" aria-label="Abrir menú">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <a href="#" class="brand-logo-wrapper">
  <img src="imagenes/pompy_negro_transparente.png" alt="POMPY" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
  <span class="brand-logo-text" style="display: none;">POMPY</span>
</a>

      <div class="nav-actions">
        <button class="icon-btn" id="openSearchBtn" aria-label="Buscar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="icon-btn" id="openWishlistBtn" aria-label="Favoritos">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span class="badge" id="wishlistCount">0</span>
        </button>
      </div>
    </div>

    <div class="search-drawer" id="searchDrawer">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="Buscar productos por nombre, categoría o marca...">
        <button id="closeSearchBtn">&times;</button>
      </div>
    </div>
  </header>

  <aside class="sidebar-drawer" id="sidebarDrawer">
    <div class="drawer-header">
      <span class="drawer-title">MENÚ</span>
      <button class="close-btn" id="closeMenuBtn">&times;</button>
    </div>
    <div class="drawer-body">
      <div class="nav-categories" id="dynamicSidebarNav">
      </div>

      <div class="sort-section">
        <label class="sort-label">ORDENAR POR</label>
        <select id="sortSelect" class="sort-select">
          <option value="default">Orden predeterminado (Sheet)</option>
          <option value="priceLow">Menor precio primero</option>
          <option value="priceHigh">Mayor precio primero</option>
          <option value="nameAZ">Nombre A-Z</option>
        </select>
      </div>

      <div class="drawer-actions">
        <button class="btn-reset" id="resetFiltersBtn">LIMPIAR FILTROS</button>
      </div>
    </div>
  </aside>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="main-content">
    <div class="catalog-header">
      <h1 class="catalog-title">CATÁLOGO EXCLUSIVO</h1>
      <p class="catalog-subtitle" id="productCountText">Cargando colección...</p>
    </div>

    <div class="product-grid" id="productsGrid">
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
      <div class="skeleton-item"></div>
    </div>

    <div class="load-more-wrapper">
      <button class="btn-load-more d-none" id="loadMoreBtn">CARGAR MÁS</button>
    </div>
  </main>

  <div class="modal" id="productModal">
    <div class="modal-overlay" id="productModalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="closeProductModal">&times;</button>
      <div class="modal-body" id="modalProductDetails"></div>
    </div>
  </div>

  <div class="modal" id="wishlistModal">
    <div class="modal-overlay" id="wishlistModalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="closeWishlistModal">&times;</button>
      <div class="modal-header-text">MIS FAVORITOS</div>
      <div class="modal-body" id="wishlistItemsList"></div>
      <div class="modal-footer">
        <button class="btn-ws-checkout" id="sendWishlistWsBtn" disabled>CONSULTAR FAVORITOS POR WHATSAPP</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 POMPY. Todos los derechos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body> 
</html>
