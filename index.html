<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos - Lencería</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .product-card {
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
    .product-img-wrapper {
      height: 300px;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    .product-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold">Colección Lencería</h2>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
      
      <!-- Producto 1 -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm product-card">
          <div class="product-img-wrapper position-relative">
            <span class="badge bg-danger position-absolute top-0 start-0 m-3">Oferta</span>
            <img src="https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80" alt="Conjunto Encaje">
          </div>
          <div class="card-body d-flex flex-column">
            <p class="text-muted small mb-1">Conjuntos</p>
            <h5 class="card-title fw-semibold text-dark mb-2">Conjunto Encaje Romance</h5>
            <div class="mb-3">
              <span class="text-danger fw-bold fs-5">$18.500</span>
              <span class="text-muted text-decoration-line-through small ms-2">$23.000</span>
            </div>
            <button class="btn btn-outline-dark w-100 mt-auto">
              <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
            </button>
          </div>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm product-card">
          <div class="product-img-wrapper">
            <img src="https://images.unsplash.com/photo-1596480039102-132d03a116f7?auto=format&fit=crop&w=600&q=80" alt="Body Saten">
          </div>
          <div class="card-body d-flex flex-column">
            <p class="text-muted small mb-1">Bodys</p>
            <h5 class="card-title fw-semibold text-dark mb-2">Body Satén & Puntilla</h5>
            <div class="mb-3">
              <span class="text-dark fw-bold fs-5">$24.000</span>
            </div>
            <button class="btn btn-outline-dark w-100 mt-auto">
              <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
            </button>
          </div>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm product-card">
          <div class="product-img-wrapper position-relative">
            <span class="badge bg-dark position-absolute top-0 start-0 m-3">Nuevo</span>
            <img src="https://images.unsplash.com/photo-1516575150278-77136aed6920?auto=format&fit=crop&w=600&q=80" alt="Bralette Modal">
          </div>
          <div class="card-body d-flex flex-column">
            <p class="text-muted small mb-1">Bralettes</p>
            <h5 class="card-title fw-semibold text-dark mb-2">Bralette Soft Cotton</h5>
            <div class="mb-3">
              <span class="text-dark fw-bold fs-5">$14.200</span>
            </div>
            <button class="btn btn-outline-dark w-100 mt-auto">
              <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
            </button>
          </div>
        </div>
      </div>

      <!-- Producto 4 -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm product-card">
          <div class="product-img-wrapper">
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80" alt="Bata Seda">
          </div>
          <div class="card-body d-flex flex-column">
            <p class="text-muted small mb-1">Dormir & Robes</p>
            <h5 class="card-title fw-semibold text-dark mb-2">Bata Saten Deluxe</h5>
            <div class="mb-3">
              <span class="text-dark fw-bold fs-5">$32.900</span>
            </div>
            <button class="btn btn-outline-dark w-100 mt-auto">
              <i class="bi bi-cart-plus me-2"></i>Añadir al carrito
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
