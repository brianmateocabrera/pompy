<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Pompy</title>
    <!-- Librerías desde CDN -->
    <link href="https://unpkg.com" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        /* IMPORTANTE: La tabla DEBE tener altura para que Tabulator funcione */
        #excel-table { height: 400px; border: 1px solid #ccc; margin-top: 10px; }
        #status { padding: 10px; background: #f0f0f0; margin-bottom: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>📊 Inventario Pompy</h2>
    <div id="status">Cargando sistema...</div>
    <button onclick="nuevaFila()">➕ NUEVO</button>
    <button id="btn-save" onclick="guardarTodo()">💾 GUARDAR</button>
    
    <div id="excel-table"></div>

    <script>
        let table;
        let fileSha = null;

        function log(msg, error = false) {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.color = error ? "red" : "black";
        }

        function initTable(data =) {
            // Verificación de seguridad para la librería
            if (typeof Tabulator === "undefined") {
                log("Error: La librería no cargó. Reintentando...", true);
                setTimeout(() => initTable(data), 1500);
                return;
            }

            table = new Tabulator("#excel-table", {
                data: data,
                height: "400px", // Altura fija necesaria
                layout: "fitColumns",
                columns: [
                    {title: "ID", field: "id", editor: "number", width: },
                    {title: "Producto", field: "nombre", editor: "input"},
                    {title: "Precio", field: "precio", editor: "number", hozAlign: "right"},
                    {title: "Stock", field: "stock", editor: "number", hozAlign: "center"},
                    {title: "Borrar", formatter: "buttonCross", cellClick: (e, c) => cgetRow()delete()}
                ]
            });
            log("✅ Tabla lista.");
        }

        async function cargarDatos() {
            log("Conectando con GitHub...");
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'GET', path: 'inventario.json' })
                });
                const json = await res.json();
                if (json.success) {
                    fileSha = json.sha;
                    initTable(json.data);
                } else {
                    initTable(); // Inicia vacía si el archivo no existe
                    log("Inventario nuevo.");
                }
            } catch (e) {
                log("Error de red: " + e.message, true);
                initTable();
            }
        }

        function nuevaFila() {
            if (table) table.addRow({ id: Date.now().toString().slice(-4), nombre: "Nuevo", precio: 0, stock: 0 });
        }

        async function guardarTodo() {
            if (!table) return;
            log("Guardando...");
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'PUT',
                        path: 'inventario.json',
                        content: JSON.stringify(table.getData(), null, 2),
                        sha: fileSha || undefined
                    })
                });
                const resJson = await res.json();
                if (resJson.success) {
                    fileSha = resJson.sha;
                    log("✨ ¡Guardado con éxito!");
                } else {
                    log("Error: " + resJson.error, true);
                }
            } catch (e) {
                log("Error de conexión.", true);
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
