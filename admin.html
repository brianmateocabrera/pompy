<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pompy</title>
    
    <!-- Enlaces externos confiables -->
    <link href="https://unpkg.com" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com"></script>

    <style>
        body { font-family: sans-serif; margin: 15px; background: #f4f4f9; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; }
        button { padding: 12px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        .btn-add { background: #28a745; color: white; }
        .btn-save { background: #007bff; color: white; }
        #status { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 14px; background: #eee; }
        #excel-table { background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>📊 Gestión de Inventario</h2>
    
    <div id="status">Iniciando sistema...</div>

    <div class="controls">
        <button class="btn-add" onclick="agregarFila()">➕ Nuevo</button>
        <button class="btn-save" onclick="guardar()">💾 Guardar en GitHub</button>
    </div>

    <div id="excel-table"></div>

    <script>
        let table;
        let fileSha = null;

        function log(msg, color = "black") {
            const s = document.getElementById('status');
            s.innerText = msg;
            s.style.color = color;
        }

        // Función para inicializar la tabla
        function initTable(data =) {
            if (typeof Tabulator === "undefined") {
                log("Error: La librería Tabulator no cargó. Revisa tu conexión.", "red");
                return;
            }

            table = new Tabulator("#excel-table", {
                data: data,
                layout: "fitColumns",
                columns: [
                    {title: "ID", field: "id", width: editor: "number"},
                    {title: "Nombre", field: "nombre", editor: "input"},
                    {title: "Categoría", field: "categoria", editor: "input"},
                    {title: "Precio", field: "precio", editor: "number"},
                    {title: "Stock", field: "stock", editor: "number"},
                    {title: "Imagen URL", field: "imagen", editor: "input"},
                    {title: "Borrar", formatter: "buttonCross", width: cellClick: (e, c) => cgetRow()delete()}
                ]
            });
            log("Tabla lista. Puedes añadir productos.", "green");
        }

        async function cargar() {
            log("Conectando con el servidor...");
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'GET', path: 'inventario.json' })
                });
                
                const resJson = await res.json();
                
                if (resJson.success) {
                    fileSha = resJson.sha;
                    initTable(resJson.data);
                } else if (resJson.status === 404) {
                    initTable();
                    log("Inventario nuevo (archivo no encontrado).", "blue");
                } else {
                    log("Error de API: " + resJson.error, "red");
                    initTable(); 
                }
            } catch (e) {
                log("Error de red: " + e.message, "red");
                initTable();
            }
        }

        function agregarFila() {
            if(!table) return log("La tabla no está lista", "red");
            table.addRow({ id: Date.now(), nombre: "Nuevo", precio: 0, stock: 0 });
        }

        async function guardar() {
            if(!table) return;
            log("Guardando en GitHub...", "orange");
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'PUT',
                        path: 'inventario.json',
                        content: JSON.stringify(table.getData(), null, 2),
                        sha: fileSha || undefined
                    })
                });
                const resJson = await res.json();
                if(resJson.success) {
                    fileSha = resJson.sha;
                    log("¡Guardado con éxito!", "green");
                } else {
                    log("Error al guardar: " + resJson.error, "red");
                }
            } catch (e) {
                log("Error de conexión: " + e.message, "red");
            }
        }

        // Ejecutar al cargar la página
        window.onload = cargar;
    </script>
</body>
</html>
