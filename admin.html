<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pompy - Sin Librerías</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; background: #f4f4f9; }
        .header { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        [contenteditable]:focus { outline: 2px solid #007bff; background: #fff; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-add { background: #28a745; color: white; }
        .btn-save { background: #007bff; color: white; }
        .btn-del { background: #dc3545; color: white; padding: 5px 10px; }
        #status { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>📦 Gestión de Inventario</h2>
        <div id="status">Cargando datos...</div>
        <button class="btn btn-add" onclick="agregarFila()">+ Nuevo Producto</button>
        <button class="btn btn-save" onclick="guardarCambios()">💾 Guardar Todo</button>
    </div>

    <table id="tabla-inventario">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <!-- Las filas se generarán aquí -->
        </tbody>
    </table>

    <script>
        let inventarioActual =;
        let fileSha = null;

        function mostrarStatus(msg, color = "black") {
            const s = document.getElementById('status');
            s.innerText = msg;
            s.style.color = color;
        }

        // 1. Cargar datos iniciales
        async function cargarDatos() {
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'GET', path: 'inventario.json' })
                });
                const resJson = await res.json();
                
                if (resJson.success) {
                    fileSha = resJson.sha;
                    inventarioActual = resJson.data;
                    renderizarTabla();
                    mostrarStatus("✅ Datos cargados correctamente.");
                } else {
                    mostrarStatus("ℹ️ Inventario vacío. Comienza a crear productos.");
                }
            } catch (e) {
                mostrarStatus("❌ Error al conectar: " + e.message, "red");
            }
        }

        // 2. Dibujar la tabla manualmente
        function renderizarTabla() {
            const cuerpo = document.getElementById('cuerpo-tabla');
            cuerpo.innerHTML = '';
            inventarioActual.forEach((prod, index) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td contenteditable="true" onblur="actualizarDato(${index}, 'id', this.innerText)">${prod.id}</td>
                    <td contenteditable="true" onblur="actualizarDato(${index}, 'nombre', this.innerText)">${prod.nombre}</td>
                    <td contenteditable="true" onblur="actualizarDato(${index}, 'categoria', this.innerText)">${prod.categoria}</td>
                    <td contenteditable="true" onblur="actualizarDato(${index}, 'precio', this.innerText)">${prod.precio}</td>
                    <td contenteditable="true" onblur="actualizarDato(${index}, 'stock', this.innerText)">${prod.stock}</td>
                    <td><button class="btn-del" onclick="eliminarFila(${index})">Eliminar</button></td>
                `;
                cuerpo.appendChild(fila);
            });
        }

        function actualizarDato(index, campo, valor) {
            inventarioActual[index][campo] = valor;
        }

        function agregarFila() {
            inventarioActual.push({ id: Date.now().toString().slice(-4), nombre: 'Nuevo', categoria: 'Varios', precio: '0', stock: '0' });
            renderizarTabla();
        }

        function eliminarFila(index) {
            if (confirm("¿Eliminar este producto?")) {
                inventarioActual.splice(index, 1);
                renderizarTabla();
            }
        }

        // 3. Guardar en GitHub
        async function guardarCambios() {
            mostrarStatus("🚀 Guardando en GitHub...", "blue");
            try {
                const res = await fetch('/api/crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'PUT',
                        path: 'inventario.json',
                        content: JSON.stringify(inventarioActual, null, 2),
                        sha: fileSha || undefined
                    })
                });
                const resJson = await res.json();
                if (resJson.success) {
                    fileSha = resJson.sha;
                    mostrarStatus("✨ ¡Guardado con éxito!", "green");
                } else {
                    mostrarStatus("❌ Error: " + resJson.error, "red");
                }
            } catch (e) {
                mostrarStatus("❌ Error de red.", "red");
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
